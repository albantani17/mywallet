name: Android release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild -p android --no-install

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          # Tolerate line wraps / stray whitespace in the secret value.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/release.keystore || {
            echo "::error::Could not base64-decode ANDROID_KEYSTORE_BASE64. Re-create the secret from the raw .jks:"
            echo "::error::  Linux:  base64 -w0 my-release.jks | gh secret set ANDROID_KEYSTORE_BASE64"
            echo "::error::  macOS:  base64 my-release.jks | tr -d '\\n' | gh secret set ANDROID_KEYSTORE_BASE64"
            exit 1
          }

          # --- diagnostics (no secrets printed) ---
          echo "decoded size: $(stat -c %s android/app/release.keystore) bytes"
          echo "file type:    $(file -b android/app/release.keystore)"
          echo "sha256:       $(sha256sum android/app/release.keystore | cut -d' ' -f1)"
          echo "pw length:    ${#ANDROID_KEYSTORE_PASSWORD}"
          echo "--- keytool -list (no password: shows format, not entries) ---"
          keytool -list -keystore android/app/release.keystore -storepass "" 2>&1 | head -n 5 || true
          echo "--- keytool -list (with ANDROID_KEYSTORE_PASSWORD) ---"
          keytool_out="$(keytool -list -keystore android/app/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1)"
          keytool_rc=$?
          printf '%s\n' "$keytool_out" | head -n 20
          if [ $keytool_rc -ne 0 ]; then
            echo "::error::keytool could not open the keystore (rc=$keytool_rc). See the message above:"
            echo "::error:: 'Invalid keystore format' / 'DER input' -> the secret is not the raw .jks bytes (wrong file, double base64, or truncated)."
            echo "::error:: 'password was incorrect' / 'Keystore was tampered with' -> ANDROID_KEYSTORE_PASSWORD does not match this keystore."
            exit 1
          fi

      - name: Write signing properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # `expo prebuild` writes gradle.properties WITHOUT a trailing newline, so a
          # plain `>>` glues the first line below onto the last generated property:
          #   expo.inlineModules.watchedDirectories=[]MYWALLET_UPLOAD_STORE_FILE=...
          # That breaks JSON.parse in expo's autolinking `mirror-kotlin-inline-modules`
          # step (which Gradle runs at configuration time and whose stderr it swallows,
          # surfacing only as "Process 'command 'node'' finished with non-zero exit
          # value 1") and leaves the store-file property undefined for signing.
          if [ -n "$(tail -c1 android/gradle.properties)" ]; then
            printf '\n' >> android/gradle.properties
          fi

          {
            echo "MYWALLET_UPLOAD_STORE_FILE=release.keystore"
            echo "MYWALLET_UPLOAD_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "MYWALLET_UPLOAD_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "MYWALLET_UPLOAD_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> android/gradle.properties

          # Guard against this class of corruption coming back silently.
          if ! grep -q '^MYWALLET_UPLOAD_STORE_FILE=' android/gradle.properties; then
            echo "::error::Signing properties were appended onto an existing line in android/gradle.properties"
            exit 1
          fi

      # Runs the exact JS bundling that Gradle's createBundleReleaseJsAndAssets
      # task performs, but with clean, un-nested output so a Metro/JS error is
      # readable instead of surfacing only as "command 'node' exit value 1".
      - name: Bundle JS (diagnostic)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npx expo export:embed \
            --platform android \
            --dev false \
            --bundle-output "$RUNNER_TEMP/index.android.bundle" \
            --assets-dest "$RUNNER_TEMP/android-assets" \
            --verbose
      - name: Build release APK
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: android

      - name: Verify APK is signed with the release key
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mywallet-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
